name: Android test APK
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-test-draft
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: v0.1.1-device-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 5fc346839b5d0eef006ed8404392afb4dfae428d
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Verify and build USB demo APK
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test test_support
          flutter analyze
          flutter test
          test ! -e android/key.properties
          flutter build apk --debug --dart-define=API_BASE_URL=http://127.0.0.1:9090/ELPSY/api/
          mkdir -p work/delivery
          cp build/app/outputs/flutter-apk/app-debug.apk work/delivery/ELPSY-Shop-0.1.1-android-test.apk
          cd work/delivery
          sha256sum ELPSY-Shop-0.1.1-android-test.apk > SHA256SUMS.txt
          printf 'Source commit: %s\nWorkflow run: %s/%s/actions/runs/%s\nThis APK was rebuilt in GitHub Actions. Native emulator evidence belongs to the earlier cloud artifact SHA; this new binary has not run on a phone. USB demo / mock only.\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > BUILD.txt
      - name: Save downloadable test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ELPSY-Shop-0.1.1-android-test
          path: work/delivery/
          retention-days: 14
          compression-level: 0
      - name: Attach to existing private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          gh release upload "$RELEASE_TAG" work/delivery/ELPSY-Shop-0.1.1-android-test.apk work/delivery/SHA256SUMS.txt work/delivery/BUILD.txt --repo "$GITHUB_REPOSITORY"
