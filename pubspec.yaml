name: elpsy_shop
description: Figura 顧客 App，現貨與預購共用既有後端。
publish_to: none
version: 0.2.0+3
environment:
  sdk: '>=3.13.5 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.9
  flutter_riverpod: 3.4.3
  dio: 5.11.1
  go_router: 18.0.2
  flutter_secure_storage: 11.2.0
  uuid: 4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC.ttf
